name: Autograding - Popularidade de nomes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar_e_testar:
    name: Compilacao e testes Hspec
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo do aluno
        uses: actions/checkout@v4

      - name: Preparar GHC e Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10.3.0'

      - name: Cache do Cabal
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.4.8-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.4.8-

      - name: Atualizar indice de pacotes
        run: cabal update

      - name: Compilar projeto e testes
        run: cabal build --enable-tests

      - name: Avaliar com especificacao JSON legada
        run: python3 scripts/autograde.py
